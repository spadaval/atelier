[workspace]
members = [
    "crates/atelier-app",
    "crates/atelier-cli",
    "crates/atelier-core",
    "crates/atelier-records",
    "crates/atelier-workflow",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/dollspace-gay/atelier"
homepage = "https://github.com/dollspace-gay/atelier"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
fs2 = "0.4"
icu_normalizer = "2.1"
icu_properties = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1-checked = "0.10.0"
sha2 = "0.11.0"
toml = "0.8"

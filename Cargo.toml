# Atelier (docs/design.md). `atelier-cli` builds
# the one binary the release ships, `atelier`; the Desk's server,
# `atelier-desk`, is built and tested here and not released.
[workspace]
members = [
    "crates/atelier-app",
    "crates/atelier-cli",
    "crates/atelier-core",
    "crates/atelier-desk",
    "crates/atelier-records",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/spadaval/atelier"
homepage = "https://github.com/spadaval/atelier"
publish = false
version = "0.6.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
toml = "0.8"

# The profile `dist` builds the release with.
[profile.dist]
inherits = "release"
lto = "thin"

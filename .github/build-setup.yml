# Steps dist runs before each release build (dist-workspace.toml's
# github-build-setup): crates/atelier-site's build.rs builds the web app with
# pnpm in a release build, so every runner needs Node and pnpm.
- name: Install pnpm
  uses: pnpm/action-setup@v4
  with:
    package_json_file: crates/atelier-site/web/package.json
- name: Install Node
  uses: actions/setup-node@v6
  with:
    node-version: lts/*

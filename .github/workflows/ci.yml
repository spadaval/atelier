# Runs the validation commands from AGENTS.md on the platforms releases ship.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-rust-toolchain sets RUST_BACKTRACE, which appends backtraces to the
# error output that tests compare exactly.
env:
  RUST_BACKTRACE: 0

jobs:
  # Decides which jobs the change needs (scripts/ci-jobs.sh), and checks
  # whitespace on every change. A run whose other jobs are skipped still
  # concludes success, which the merge gate reads.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.jobs.outputs.rust }}
      desk: ${{ steps.jobs.outputs.desk }}
      extension: ${{ steps.jobs.outputs.extension }}
      evals: ${{ steps.jobs.outputs.evals }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci-jobs.test.sh
      - id: jobs
        run: scripts/ci-jobs.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
      - name: git diff --check
        run: |
          if [ -z "$BASE" ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "No base commit to compare against."
          else
            git diff --check "$BASE" HEAD
          fi

  # The workspace's lints, build and tests, and `atelier check` on this
  # repository's records. Linux only: macOS is not supported (see README.md).
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolchain and components come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Tests create repositories and commits.
      - run: |
          git config --global user.name "Atelier CI"
          git config --global user.email "ci@atelier.invalid"
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --all-targets
      - name: atelier check
        run: target/debug/atelier check
      - run: cargo nextest run --locked

  # Agent Factory's eval fixtures and harness tests
  # (evals/agent-factory/test.sh) against the atelier built from this
  # commit: each scenario's setup and grader walks, with no model called, on
  # the runner's own python3. A change to the binary or the skill that
  # breaks a scenario fails here.
  evals:
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The replay cases build their fixtures from this repository's
      # history (evals/agent-factory/harness/replay.py).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      # The harness tests make repositories and commits.
      - run: |
          git config --global user.name "Atelier CI"
          git config --global user.email "ci@atelier.invalid"
      # A replay run is confined with bubblewrap (harness/confine.py), and
      # harness/test_confine.py runs commands in that sandbox. Ubuntu's
      # AppArmor forbids the unprivileged user namespace it needs unless
      # this setting is off.
      - run: |
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo build --locked -p atelier-cli
      - run: evals/agent-factory/test.sh target/debug/atelier

  # The Desk's app (desk/): typecheck, Vitest, the build, then Playwright on
  # the built app with the API answered from fixtures. It builds no Rust.
  desk:
    needs: changes
    if: needs.changes.outputs.desk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desk/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: desk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm e2e

  # The T3 Code extension's typecheck and build, then its tests
  # (t3-extension/run-tests.mjs) on the built script in headless Chrome,
  # against an atelier-desk and the Desk's app built from this commit,
  # serving a repository the tests write. A change to the Desk that breaks
  # the extension fails here. Its release script's test runs here too, since
  # that test builds the extension's bundle.
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml; target/ is cached.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desk/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: |
            desk/pnpm-lock.yaml
            t3-extension/pnpm-lock.yaml
      - run: scripts/t3-extension-release.test.sh
      - run: cargo build --locked -p atelier-desk
      - run: pnpm install --frozen-lockfile
        working-directory: desk
      - run: pnpm build
        working-directory: desk
      - run: pnpm install --frozen-lockfile
        working-directory: t3-extension
      - run: pnpm typecheck
        working-directory: t3-extension
      - run: pnpm build
        working-directory: t3-extension
      - run: node t3-extension/run-tests.mjs
        env:
          BROWSER: /usr/bin/google-chrome

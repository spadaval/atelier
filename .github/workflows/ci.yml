# Runs the validation commands from AGENTS.md on the platforms releases ship.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-rust-toolchain sets RUST_BACKTRACE, which appends backtraces to the
# error output that tests compare exactly.
env:
  RUST_BACKTRACE: 0

jobs:
  # Decides which jobs the change needs (scripts/ci-jobs.sh), and checks
  # whitespace on every change. A run whose other jobs are skipped still
  # concludes success, which the merge gate reads.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.jobs.outputs.rust }}
      desk: ${{ steps.jobs.outputs.desk }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci-jobs.test.sh
      - id: jobs
        run: scripts/ci-jobs.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
      - name: git diff --check
        run: |
          if [ -z "$BASE" ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "No base commit to compare against."
          else
            git diff --check "$BASE" HEAD
          fi

  # The workspace's build and tests, and `atelier check` on this
  # repository's records. Linux only: macOS is not supported (see README.md).
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolchain and components come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Tests create repositories and commits.
      - run: |
          git config --global user.name "Atelier CI"
          git config --global user.email "ci@atelier.invalid"
      - run: cargo fmt -- --check
      - run: cargo build --locked --all-targets
      - name: atelier check
        run: target/debug/atelier check
      - run: cargo nextest run --locked

  # The Desk's app (desk/): typecheck, Vitest, the build, then Playwright on
  # the built app with the API answered from fixtures. It builds no Rust.
  desk:
    needs: changes
    if: needs.changes.outputs.desk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desk/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: desk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm e2e

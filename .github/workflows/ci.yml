# Runs the validation commands from AGENTS.md on the platforms releases ship.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-rust-toolchain sets RUST_BACKTRACE, which appends backtraces to the
# error output that tests compare exactly.
# ATELIER_NO_UPDATE_CHECK keeps doctor and status off the network; the
# tests that cover the update check fake it instead.
env:
  RUST_BACKTRACE: 0
  ATELIER_NO_UPDATE_CHECK: 1

jobs:
  # Decides which jobs the change needs (scripts/ci-jobs.sh), and checks
  # whitespace on every change. A run whose other jobs are skipped still
  # concludes success, which is what ci.passed reads.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.jobs.outputs.rust }}
      web: ${{ steps.jobs.outputs.web }}
      next: ${{ steps.jobs.outputs.next }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/ci-jobs.test.sh
      - id: jobs
        run: scripts/ci-jobs.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
      - name: git diff --check
        run: |
          if [ -z "$BASE" ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "No base commit to compare against."
          else
            git diff --check "$BASE" HEAD
          fi

  # Linux only: macOS is not supported (see README.md).
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The toolchain and components come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Tests create repositories and commits.
      - run: |
          git config --global user.name "Atelier CI"
          git config --global user.email "ci@atelier.invalid"
      - run: cargo fmt -- --check
      - run: cargo build -p atelier-cli
      - run: target/debug/atelier check
      - run: cargo nextest run
      - run: cargo nextest run --features test-hooks

  # The new workspace, next/ (docs/strategies/redesign-architecture.md). It
  # deletes the old workspace first, so a build that reads anything under
  # crates/, by a path dependency, a module path, an include, a symlink or a
  # build script, fails here. The steps run as written in a clone.
  next:
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          cache-workspaces: next
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: rm -rf ../crates
      - run: cargo fmt -- --check
      - run: cargo build --locked --all-targets
      - run: cargo nextest run --locked

  # The site's app (crates/atelier-site/web): typecheck, Vitest, the build,
  # then Playwright against a debug `atelier serve` that embeds that build.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/atelier-site/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/atelier-site/web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: crates/atelier-site/web/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      # The Playwright suite's fixture repositories make commits.
      - run: |
          git config --global user.name "Atelier CI"
          git config --global user.email "ci@atelier.invalid"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo build -p atelier-cli
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm e2e

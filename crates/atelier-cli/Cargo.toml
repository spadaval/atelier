[package]
name = "atelier-cli"
description = "The atelier command"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
version.workspace = true

# The release ships this package's binary; `dist` builds a package with
# `publish = false` only when told to.
[package.metadata.dist]
dist = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
atelier-core = { path = "../atelier-core" }
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true

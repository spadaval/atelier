[package]
name = "atelier-site"
description = "Read-only server for every Atelier repository on this host"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
atelier-app = { path = "../atelier-app" }
atelier-core = { path = "../atelier-core" }
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
ts-rs.workspace = true

[dev-dependencies]
tempfile = "3"

[package]
name = "atelier-desk"
description = "The Desk's server: the human's web tool, reading Atelier records from commits"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The Desk is not part of the tracker's release: `dist` builds and ships
# only `atelier`.
[package.metadata.dist]
dist = false

[[bin]]
name = "atelier-desk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
atelier-app = { path = "../atelier-app" }
atelier-core = { path = "../atelier-core" }
atelier-records = { path = "../atelier-records" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
toml.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
ts-rs = "12"
# The T3 Code client: blocking HTTP over loopback, with no TLS.
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile.workspace = true

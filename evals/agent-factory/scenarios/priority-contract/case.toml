defect = """
The shared priority contract (`IssuePriority`) gives records and the CLI
two vocabularies that refuse each other. Records store `P0` to `P3`, but CLI
input is parsed with `from_label` alone, so `issue create -p P1` and `issue
list --priority P1` are refused. Its one parse error, used for record tokens
and CLI words alike, always says `Valid values: critical, high, medium,
low`, so a record holding `low` fails `atelier check` with a message that
lists the words, while the file needs `P3`.
"""


The change makes land's touched-claims walk follow `advances` links, so a
commit that only adds a new issue advancing a mission pulls the mission into
the touched set and, through it, every done issue of that mission. A
one-record planning commit then re-verifies the mission's whole done work
and fails `land` on any old problem in it, which `land` was meant to leave
to `doctor`. Only the mission's own claim depends on its advancing work; no
sibling's does.
"""


defect = """
`merge --sync` gives each rerun receipt the summary `<old summary> (rerun
after merging <base>)`, but takes the old summary from the receipt's
`summary` field, which holds the receipt's whole body (its Summary, Command,
Exit status and output sections), not its Summary section. So a rerun
receipt nests the old receipt's whole body inside its own Summary, every
later sync nests it again, and field-like lines inside it, such as `Test
summary:`, can be read as the new receipt's own fields.
"""

id = "atelier-al1y"
title = "Add atelier merge --sync to bring the base in, re-prove and report approval survival"
goal = """
Orchestrators hand-built the same macro 44+ times: commit records, `git merge master`, rerun both evidence suites, record evidence, `atelier merge`, `land`, push only on success. One command should do the catch-up step and say whether the approval survived (clean merge) or which conflict-resolved files need re-review.
"""

schema: atelier.workflow
schema_version: 3
branch_policy:
  base_branch: master
  merge_strategy: merge_commit
issue_types:
  bug:
    label: Bug
  decision:
    label: Decision
  feature:
    label: Feature
  mission:
    label: Mission
  spike:
    label: Spike
  task:
    label: Task
  validation:
    label: Validation
statuses:
  draft:
    category: todo
  backlog:
    category: todo
  todo:
    category: todo
  in_progress:
    category: active
  blocked:
    category: blocked
  review:
    category: active
  done:
    category: done
  superseded:
    category: done
workflows:
  objective:
    applies_to:
    - mission
    initial_status: draft
    done_statuses:
    - done
    - superseded
    transitions:
      ready:
        from: [draft]
        to: todo
        description: The outcome, immediate work, and proof route are clear enough to execute.
        validators:
        - issue.sections_parseable
      start:
        from: [todo, blocked]
        to: in_progress
        description: Start work.
        validators:
        - blockers.transitive_none_open
      block:
        from: [todo, in_progress, review]
        to: blocked
        description: Record a blocker.
      request_review:
        from: [in_progress]
        to: review
        description: Ready for independent review.
      revise:
        from: [review]
        to: in_progress
        description: Return to active work after review findings.
      close:
        from: [in_progress, review]
        to: done
        required_fields: [close_reason]
        description: Done claim; commit it on the work branch before review.
        validators:
        - blockers.none_open
      supersede:
        from: [draft, todo, blocked, in_progress]
        to: superseded
        required_fields: [close_reason]
        description: Retire work that evidence made obsolete.
  work:
    applies_to:
    - bug
    - feature
    - spike
    - task
    - validation
    initial_status: todo
    done_statuses:
    - done
    - superseded
    transitions:
      plan:
        from: [backlog]
        to: todo
        description: Pull someday work into the near-term plan.
      defer:
        from: [todo, blocked]
        to: backlog
        description: Park work that is recorded but not near-term.
      start:
        from: [todo, blocked]
        to: in_progress
        description: Start work.
        validators:
        - blockers.transitive_none_open
      block:
        from: [todo, in_progress, review]
        to: blocked
        description: Record a blocker.
      request_review:
        from: [in_progress]
        to: review
        description: Ready for independent review.
      revise:
        from: [review]
        to: in_progress
        description: Return to active work after review findings.
      close:
        from: [in_progress, review]
        to: done
        required_fields: [close_reason]
        description: Done claim; commit it on the work branch before review. A parent closes after its children.
        validators:
        - blockers.none_open
        - work.terminal
      supersede:
        from: [backlog, todo, blocked, in_progress]
        to: superseded
        required_fields: [close_reason]
        description: Retire work that is no longer needed.
  decision:
    applies_to:
    - decision
    initial_status: todo
    done_statuses:
    - done
    - superseded
    transitions:
      decide:
        from: [todo, blocked]
        to: done
        required_fields: [close_reason]
        description: Record the decision. Decisions need no branch and may close on the base branch as a planning change.
        validators:
        - decision.recorded
        - blockers.none_open
        - work.terminal
      block:
        from: [todo]
        to: blocked
        description: Record a blocker.
      supersede:
        from: [todo, blocked]
        to: superseded
        required_fields: [close_reason]
        description: Retire a question that no longer needs deciding.
# Run on the merged tree in a temporary checkout. Tests keep TMPDIR inside its
# ignored target/, since /tmp on this host is a small tmpfs.
merge_checks:
  - shell.check:
      command: "git diff --check HEAD^ HEAD -- . ':!.atelier'"
  - shell.check:
      command: "cargo fmt -- --check"
  - shell.check:
      command: "cargo metadata --locked --format-version 1 > /dev/null"
  - shell.check:
      command: "mkdir -p target/tmp && TMPDIR=\"$PWD/target/tmp\" cargo nextest run"
  - shell.check:
      command: "mkdir -p target/tmp && TMPDIR=\"$PWD/target/tmp\" cargo nextest run --features test-hooks"

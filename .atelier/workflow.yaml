schema: atelier.workflow
schema_version: 3
branch_policy:
  base_branch: master
  merge_strategy: merge_commit
issue_types:
  bug:
    label: Bug
  decision:
    label: Decision
  feature:
    label: Feature
  loose_end:
    label: Loose end
  mission:
    label: Mission
  spike:
    label: Spike
  task:
    label: Task
  validation:
    label: Validation
statuses:
  draft:
    category: todo
  backlog:
    category: todo
  todo:
    category: todo
  in_progress:
    category: active
  done:
    category: done
  superseded:
    category: done
workflows:
  objective:
    applies_to:
    - mission
    initial_status: draft
    done_statuses:
    - done
    - superseded
    transitions:
      ready:
        from: [draft]
        to: todo
        description: Meets Agent Factory's ready-mission standard (procedures/plan.md, Ready Missions); success criteria are optional (ADR 0024).
        validators:
        - issue.sections_parseable
      start:
        from: [todo]
        to: in_progress
        description: Start work.
        validators:
        - blockers.transitive_none_open
      close:
        from: [in_progress]
        to: done
        required_fields: [close_reason]
        description: Close the mission once all its work is merged and its validation, if it has one, is done; the Report says what it achieved.
        validators:
        - blockers.none_open
      supersede:
        from: [draft, todo, in_progress]
        to: superseded
        required_fields: [close_reason]
        description: Retire work that evidence made obsolete.
  work:
    applies_to:
    - bug
    - feature
    - spike
    - task
    initial_status: todo
    done_statuses:
    - done
    - superseded
    transitions:
      plan:
        from: [backlog]
        to: todo
        description: Pull someday work into the near-term plan.
      defer:
        from: [todo]
        to: backlog
        description: Park work that is recorded but not near-term.
      start:
        from: [todo]
        to: in_progress
        description: Start work.
        validators:
        - blockers.transitive_none_open
      supersede:
        from: [backlog, todo, in_progress]
        to: superseded
        required_fields: [close_reason]
        description: Retire work that is no longer needed. Work is done when atelier merge integrates it.
  decision:
    applies_to:
    - decision
    initial_status: todo
    done_statuses:
    - done
    - superseded
    transitions:
      decide:
        from: [todo]
        to: done
        required_fields: [close_reason]
        description: Record the decision. Decisions need no branch and are decided on the base branch as a planning change.
        validators:
        - decision.recorded
        - blockers.none_open
        - work.terminal
      supersede:
        from: [todo]
        to: superseded
        required_fields: [close_reason]
        description: Retire a question that no longer needs deciding.
  on_base:
    applies_to:
    - loose_end
    - validation
    initial_status: todo
    done_statuses:
    - done
    - superseded
    transitions:
      plan:
        from: [backlog]
        to: todo
        description: Bring a parked item back into the near-term plan.
      defer:
        from: [todo]
        to: backlog
        description: Park an item that is recorded but not near-term, such as a validation for later.
      done:
        from: [todo]
        to: done
        required_fields: [close_reason]
        description: Record the one-line result in the Report once what it waits on is merged. It needs no branch, review or merge, and is done on the base branch as a planning change; a bad result files a linked bug.
        validators:
        - blockers.none_open
      supersede:
        from: [backlog, todo]
        to: superseded
        required_fields: [close_reason]
        description: Retire it once it is no longer needed.
# Run on the merged tree in a temporary checkout. The whitespace check skips
# .atelier because captured evidence records end with the command output's own
# blank lines, which `git diff --check` flags. The test suites run in CI on the
# pull request, on Linux and macOS, instead of here: merge-ci-passed.sh passes
# only when CI passed on the code that merges, so merging builds nothing on
# this host (AGENTS.md, Merge Policy).
merge_checks:
  - shell.check:
      command: "git diff --check HEAD^ HEAD -- . ':!.atelier'"
  - shell.check:
      command: "cargo fmt -- --check"
  - shell.check:
      command: "cargo metadata --locked --format-version 1 > /dev/null"
  - shell.check:
      command: "scripts/merge-ci-passed.sh"
